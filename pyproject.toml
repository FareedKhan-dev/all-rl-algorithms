[project]
name = "all-rl-algorithms"
version = "0.1.0"
description = "Reinforcement learning algorithms implemented from scratch in NumPy and PyTorch, one notebook each, from Q-learning to PlaNet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.3",
]

[dependency-groups]
# `uv sync` installs this group too: Jupyter to run the notebooks, pytest for the checks.
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
